apply plugin: 'com.android.library'

android {
    namespace 'com.blitzfiles.search'
    compileSdk = 36

    defaultConfig {
        minSdk 23
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def androidx_sqlite_version = '2.7.0'
    implementation "androidx.sqlite:sqlite:$androidx_sqlite_version"
    implementation "androidx.sqlite:sqlite-bundled:$androidx_sqlite_version"
    // Keep this aligned with the app module to avoid changing existing coroutine behavior.
    //noinspection NewerVersionAvailable
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    // Android local tests run on the host JVM and therefore need the desktop native library.
    testImplementation "androidx.sqlite:sqlite-bundled-jvm:$androidx_sqlite_version"
}
